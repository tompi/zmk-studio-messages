syntax = "proto3";

package zmk.behaviors;

message Request {
    oneof request_type {
        bool list_all_behaviors = 1;
        GetBehaviorDetailsRequest get_behavior_details = 2;
        GetBehaviorSettingsRequest get_behavior_settings = 3;
        SetBehaviorSettingRequest set_behavior_setting = 4;
    }
}

message GetBehaviorDetailsRequest {
    uint32 behavior_id = 1;
}

message Response {
    oneof response_type {
        ListAllBehaviorsResponse list_all_behaviors = 1;
        GetBehaviorDetailsResponse get_behavior_details = 2;
        GetBehaviorSettingsResponse get_behavior_settings = 3;
        SetBehaviorSettingResponse set_behavior_setting = 4;
    }
}

message ListAllBehaviorsResponse {
    repeated uint32 behaviors = 1;
}

message GetBehaviorDetailsResponse {
    uint32 id = 1;
    string display_name = 2;
    repeated BehaviorBindingParametersSet metadata = 3;
}

message BehaviorBindingParametersSet {
    repeated BehaviorParameterValueDescription param1 = 1;
    repeated BehaviorParameterValueDescription param2 = 2;
}

message BehaviorParameterValueDescriptionRange {
    int32 min = 1;
    int32 max = 2;
}

message BehaviorParameterNil {}
message BehaviorParameterLayerId {}
message BehaviorParameterHidUsage {
	uint32 keyboard_max = 1;
	uint32 consumer_max = 2;
}

message BehaviorParameterValueDescription {
    string name = 1;

    oneof value_type {
        BehaviorParameterNil nil = 2;
        uint32 constant = 3;
        BehaviorParameterValueDescriptionRange range = 4;
        BehaviorParameterHidUsage hid_usage = 5;
        BehaviorParameterLayerId layer_id = 6;
    }
}

// Runtime settings of a behavior instance, such as the tapping term of a hold-tap.
// Values set here take effect right away. They are written to flash, or reverted,
// by the keymap subsystem's save_changes and discard_changes requests, and count
// towards its check_unsaved_changes.

message GetBehaviorSettingsRequest {
    uint32 behavior_id = 1;
}

message GetBehaviorSettingsResponse {
    uint32 behavior_id = 1;
    repeated BehaviorSetting settings = 2;
}

message BehaviorSetting {
    uint32 id = 1;
    string name = 2;
    int32 value = 3;
    int32 default_value = 4;

    oneof value_type {
        BehaviorSettingRange range = 5;
        BehaviorSettingOptions options = 6;
        BehaviorSettingToggle toggle = 7;
    }
}

message BehaviorSettingRange {
    int32 min = 1;
    int32 max = 2;
    string unit = 3;
}

// The value is the index of the chosen option.
message BehaviorSettingOptions {
    repeated string options = 1;
}

// The value is 0 or 1.
message BehaviorSettingToggle {}

message SetBehaviorSettingRequest {
    uint32 behavior_id = 1;
    uint32 setting_id = 2;
    int32 value = 3;
}

enum SetBehaviorSettingResponse {
    SET_BEHAVIOR_SETTING_RESP_OK = 0;
    SET_BEHAVIOR_SETTING_RESP_INVALID_BEHAVIOR = 1;
    SET_BEHAVIOR_SETTING_RESP_INVALID_SETTING = 2;
    SET_BEHAVIOR_SETTING_RESP_INVALID_VALUE = 3;
}
